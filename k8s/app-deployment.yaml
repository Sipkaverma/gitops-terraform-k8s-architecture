apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-web-app
  namespace: default
  labels:
    app: gitops-web-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gitops-web-app
  template:
    metadata:
      labels:
        app: gitops-web-app
    spec:
      containers:
        - name: nginx
          image: sipka227/fastapi-app:51e238380d07a2ec7f5ae47d27266f721cae3b44
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: gitops-web-service
  namespace: default
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: gitops-web-app
  template:
    spec:
      containers:
        - image: sipka227/fastapi-app:51e238380d07a2ec7f5ae47d27266f721cae3b44
