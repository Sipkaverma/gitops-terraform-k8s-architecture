apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-web-app
  namespace: default
  labels:
    app: gitops-web-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gitops-web-app
  template:
    metadata:
      labels:
        app: gitops-web-app
    spec:
      containers:
        - name: fastapi-app  
          image: sipka227/fastapi-app:51e238380d7a2ec7f5ae47d27266f721cae3b44
          imagePullPolicy: Never
          ports:
           - containerPort: 8000
          env:
           - name: DATABASE_URL
             value: "postgresql://dummy_user:dummy_pass@localhost:5432/dummy_db"
---
apiVersion: v1
kind: Service
metadata:
  name: gitops-web-service
  namespace: default
spec:
  type: Nodeport
  ports:
  - port: 80
    targetPort: 8000
    nodePort: 30080
  selector:
    app: gitops-web-app
