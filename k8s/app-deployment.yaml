apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-web-app
  namespace: default
  labels:
    app: gitops-web-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gitops-web-app
  template:
    metadata:
      labels:
        app: gitops-web-app
    spec:
      containers:
      - name: nginx
        image: sipka227/fastapi-app:51e238380d7a2ec7f5ae47d27266f721cae3b44
        ports:
        - containerPort: 80
        env:
        - name: DATABASE_URL
          value: "postgresql://dummy_user:dummy_pass@localhost:5432/dummy_db"
---
apiVersion: v1
kind: Service
metadata:
  name: gitops-web-service
  namespace: default
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: gitops-web-app
    containers:
- name: nginx
  image: sipka227/fastapi-app:latest
  imagePullPolicy: Never
        imagePullPolicy: Never    # Local image preserve rakhne ke liye
        command: ["/bin/sh", "-c", "while true; do sleep 3600; done"]
