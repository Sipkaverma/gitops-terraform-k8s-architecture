apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-web-app-controller
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/Sipkaverma/gitops-terraform-k8s-architecture.git'
    targetRevision: HEAD
    path: k8s
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true