apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-stack-controller
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/Sipkaverma/gitops-terraform-k8s-architecture.git'
    targetRevision: HEAD
    path: monitoring
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true